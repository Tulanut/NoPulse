<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23201C"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E58260"/>
      <stop offset="100%" stop-color="#CC6543"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#CC6543" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#33302B" stroke-width="8" />

  <!-- Center Emblem Group -->
  <g transform="translate(256, 256) scale(1.1) translate(-256, -256)" filter="url(#glow)">
    <!-- Dumbbell Handle -->
    <rect x="136" y="240" width="240" height="32" rx="16" fill="#F5F2EB"/>

    <!-- Left Weight Plates -->
    <rect x="152" y="146" width="36" height="220" rx="18" fill="url(#terracotta)"/>
    <rect x="108" y="176" width="32" height="160" rx="16" fill="#DE7C5A"/>
    <rect x="76" y="206" width="24" height="100" rx="12" fill="#BA5535"/>

    <!-- Right Weight Plates -->
    <rect x="324" y="146" width="36" height="220" rx="18" fill="url(#terracotta)"/>
    <rect x="372" y="176" width="32" height="160" rx="16" fill="#DE7C5A"/>
    <rect x="412" y="206" width="24" height="100" rx="12" fill="#BA5535"/>

    <!-- Center Pulse Line -->
    <path d="M196 256 L230 256 L244 220 L268 292 L282 256 L316 256" fill="none" stroke="#191816" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
